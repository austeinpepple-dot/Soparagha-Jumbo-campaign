# CAMPAIGN WEBSITE CONTENT MANAGEMENT
# ==========================================

# MEDIA STORAGE

media:
  input: media
  output: /media

# EDITABLE WEBSITE CONTENT

content:

  - name: campaign
    label: Campaign Information
    type: file
    path: data/campaign.json
    format: json

    fields:

      - name: fullName
        label: Candidate Full Name
        type: string
        required: true

      - name: office
        label: Political Office
        type: string

      - name: constituency
        label: Constituency
        type: string

      - name: state
        label: State
        type: string

      - name: party
        label: Political Party
        type: string

      - name: position
        label: Candidate Position
        type: string

      - name: biography
        label: Candidate Biography
        type: text
        description: Enter the approved biography.

      - name: manifesto
        label: Campaign Manifesto
        type: text
        description: Enter the approved campaign priorities.

      - name: candidatePhoto
        label: Candidate Photograph
        type: image
        description: Upload an approved photograph.

      - name: homepageBanner
        label: Homepage Banner
        type: image
        description: Upload the approved homepage campaign banner.
  
      - name: campaignEmail
        label: Official Campaign Email
        type: string

      - name: phoneNumber
        label: Campaign Phone Number
        type: string

      - name: whatsappNumber
        label: WhatsApp Number
        type: string

      - name: facebookUrl
        label: Facebook Page Link
        type: string

      - name: instagramUrl
        label: Instagram Page Link
        type: string

      - name: youtubeUrl
        label: YouTube Channel Link
        type: string



  # CAMPAIGN NEWS MANAGEMENT

  - name: news
    label: Campaign News
    type: file
    path: data/news.json
    format: json
    list: true

    fields:

      - name: title
        label: News Headline
        type: string
        required: true

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: summary
        label: News Summary
        type: text
        description: Enter a brief summary of the news.

      - name: body
        label: Full News Report
        type: text
        description: Enter the complete news article.

      - name: image
        label: News Photograph
        type: image
        description: Upload a photograph for this news article.

      - name: published
        label: Publish Article
        type: boolean
        description: Enable when the article is approved for publication.

        
  # CAMPAIGN PHOTO GALLERY MANAGEMENT

  - name: gallery
    label: Campaign Photo Gallery
    type: file
    path: data/gallery.json
    format: json
    list: true

    fields:

      - name: image
        label: Campaign Photograph
        type: image
        required: true
        description: Upload an approved campaign photograph.

      - name: caption
        label: Photo Caption
        type: text
        description: Describe the photograph.

      - name: event
        label: Campaign Event
        type: string
        description: Enter the name of the campaign event.

      - name: date
        label: Event Date
        type: date

      - name: published
        label: Publish Photograph
        type: boolean
        description: Enable when the photograph is approved for public display.

        
  # CAMPAIGN VIDEO MANAGEMENT

  - name: videos
    label: Campaign Videos
    type: file
    path: data/videos.json
    format: json
    list: true

    fields:

      - name: title
        label: Video Title
        type: string
        required: true

      - name: youtubeUrl
        label: YouTube Video Link
        type: string
        required: true
        description: Paste the full YouTube video link.

      - name: description
        label: Video Description
        type: text
        description: Describe the video.

      - name: date
        label: Publication Date
        type: date

      - name: published
        label: Publish Video
        type: boolean
        description: Enable when the video is approved for public display.


        


        
